
<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-base-200 p-5">

<div class="max-w-2xl mx-auto">

    <h1 class="text-4xl font-bold text-center mb-2">
        💰 Expense Tracker
    </h1>

    <p class="text-center mb-5">
        Track your expenses for the month
    </p>

    <div class="card bg-base-100 shadow-xl p-5">

        <select id="category" class="select select-bordered w-full mb-3">
            <option value="">Choose Category</option>
            <option>🍔 Food</option>
            <option>🚌 Travel</option>
            <option>🛍️ Shopping</option>
            <option>💡 Bills</option>
            <option>🎮 Entertainment</option>
            <option>📚 Education</option>
            <option>💊 Health</option>
            <option>📦 Other</option>
        </select>

        <input id="date" type="date"
               class="input input-bordered w-full mb-3">

        <input id="expense" type="number"
               min="0" step="5000"
               placeholder="Amount"
               class="input input-bordered w-full mb-3">

        <input id="description"
               placeholder="Description (optional)"
               class="input input-bordered w-full mb-3">

        <button onclick="addExpense()"
                class="btn btn-primary w-full">
            ➕ Add Expense
        </button>

    </div>


    <div class="card bg-base-100 shadow-xl p-5 mt-5">

        <h2 class="text-xl font-bold mb-3">
            📋 My Expenses
        </h2>

        <ul id="expenseList"></ul>

        <div class="divider"></div>

        <h2 class="text-2xl font-bold text-center">
            Total Spent: ₹<span id="total">0</span>
        </h2>

    </div>

</div>


<script>

let expenses = [];
let total = 0;

function addExpense() {

    let category = document.getElementById("category").value;
    let date = document.getElementById("date").value;
    let expense = Number(document.getElementById("expense").value);
    let description = document.getElementById("description").value;

    if (category == "" || date == "" || expense <= 0) {
        alert("Please enter category, date and expense!");
        return;
    }

    expenses.push({
        category: category,
        date: date,
        expense: expense,
        description: description
    });

    total = total + expense;

    showExpenses();

    document.getElementById("category").value = "";
    document.getElementById("date").value = "";
    document.getElementById("expense").value = "";
    document.getElementById("description").value = "";
}


function showExpenses() {

    let list = document.getElementById("expenseList");

    list.innerHTML = "";

    expenses.forEach(function(item) {

        list.innerHTML += `
            <li class="bg-base-200 p-4 rounded-xl mb-3">

                <b>${item.category}</b>

                <br>
                📅 ${item.date}

                <br>
                💰 ₹${item.expense}

                ${item.description
                    ? `<br>📝 ${item.description}`
                    : ""}

            </li>
        `;
    });

    document.getElementById("total").innerText = total;
}

</script>

</body>
</html>
